<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You've found a Glitch | Slack</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <script src="js/messages.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <div id="page">
      <header id="header">
        <nav class="header__nav" aria-label="Slack">
          <a class="header__item" href="https://slack.com/signin/find">
            <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="2.5" y="2.5" width="6" height="6" rx="1" />
                <rect x="11.5" y="2.5" width="6" height="6" rx="1" />
                <rect x="2.5" y="11.5" width="6" height="6" rx="1" />
                <rect x="11.5" y="11.5" width="6" height="6" rx="1" />
              </g>
            </svg>
            <span>Teams</span>
          </a>
          <a class="header__item" href="https://slack.com/help">
            <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="1.4">
                <circle cx="10" cy="10" r="8" />
                <circle cx="10" cy="10" r="3.6" />
                <path d="M4.4 4.4l3.1 3.1M12.5 12.5l3.1 3.1M15.6 4.4l-3.1 3.1M7.5 12.5l-3.1 3.1" />
              </g>
            </svg>
            <span>Help</span>
          </a>
          <a class="header__item" href="https://slack.com/signin">
            <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
              <rect x="1" y="1" width="18" height="18" rx="4" fill="#4a154b" />
              <rect x="4.5" y="4.5" width="4.4" height="4.4" rx="1.4" fill="#36c5f0" />
              <rect x="11.1" y="4.5" width="4.4" height="4.4" rx="1.4" fill="#2eb67d" />
              <rect x="4.5" y="11.1" width="4.4" height="4.4" rx="1.4" fill="#ecb22e" />
              <rect x="11.1" y="11.1" width="4.4" height="4.4" rx="1.4" fill="#e01e5a" />
            </svg>
            <span>Launch</span>
          </a>
        </nav>
      </header>

      <div id="page_contents">
        <div id="content">
          <img id="background" src="./assets/marrakesh-meadow-80.jpg" alt="" />
          <div id="sprite-wrapper"></div>
        </div>

        <div class="card" role="alert">
          <p class="card__code" id="error-code" hidden></p>
          <div class="card__head">
            <svg class="card__icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path
                d="M12 3.2 1.8 20.6h20.4L12 3.2Z"
                fill="none"
                stroke="#f0a830"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
              <path d="M12 9.5v5.2" stroke="#f0a830" stroke-width="1.8" stroke-linecap="round" />
              <circle cx="12" cy="17.4" r="1.1" fill="#f0a830" />
            </svg>
            <h1 id="error-title">You've found a Glitch!</h1>
          </div>
          <p id="error-text">
            You've found yourself in a weird place. Probably not the place you were looking for.
            ¯\_(ツ)_/¯
          </p>
          <div class="card__actions" id="error-actions" hidden></div>
        </div>
      </div>
      <div id="preload"></div>
    </div>
  </body>
</html>
